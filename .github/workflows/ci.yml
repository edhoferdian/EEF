name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Frontmatter, description length, ECC-mention guard, broken refs
        run: python scripts/validate_skills.py

  dist-sync:
    name: dist/*.skill matches skills/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check dist/ is up to date
        run: python scripts/package_skills.py --check

  export-targets-sync:
    name: Cross-harness exports match skills/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PyYAML (frontmatter validation)
        run: pip install pyyaml
      - name: Check AGENTS.md is up to date
        run: python scripts/export_agents_md.py --check
      - name: Check .cursor/rules/ is up to date
        run: python scripts/export_cursor.py --check
      - name: Check .windsurf/rules/ and .devin/rules/ are up to date
        run: python scripts/export_windsurf.py --check
      - name: Check .clinerules/ is up to date
        run: python scripts/export_cline.py --check
      - name: Check .github/copilot-instructions.md is up to date
        run: python scripts/export_copilot.py --check
      - name: Check .kiro/skills/ is up to date
        run: python scripts/export_kiro.py --check
      - name: Check GEMINI.md is up to date
        run: python scripts/export_gemini_md.py --check

  npm-cli-smoke-test:
    name: eef-install CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm pack produces a valid tarball
        run: npm pack --dry-run
      - name: --list runs and returns 33 skills
        run: |
          count=$(node bin/eef.js --list | wc -l)
          test "$count" -eq 33
      - name: --help runs without error
        run: node bin/eef.js --help
      - name: install target=cursor into a throwaway directory
        run: |
          mkdir -p /tmp/eef-cli-test
          cd /tmp/eef-cli-test
          node "$GITHUB_WORKSPACE/bin/eef.js" --target cursor
          test -d .cursor/rules
          test "$(ls .cursor/rules | wc -l)" -eq 33

  plugin-validate:
    name: Claude Code plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace manifest
        run: claude plugin validate .
